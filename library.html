<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reading Roadmap</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            border-bottom: 3px solid var(--accent-color);
            display: inline-block;
            width: 100%;
            padding-bottom: 10px;
        }

        .roadmap-item {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
        }

        .roadmap-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }

        .book-img {
            width: 60px;
            height: 90px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 25px;
            box-shadow: 2px 2px 8px rgba(0,0,0,0.2);
        }

        .content {
            flex-grow: 1;
        }

        .content h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            color: var(--primary-color);
        }

        .btn-read {
            background-color: var(--accent-color);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: 10px;
            transition: background 0.3s;
        }

        .roadmap-item:hover .btn-read {
            background-color: #2980b9;
        }

        .divider {
            height: 2px;
            background: #ddd;
            margin: 30px 0;
            border: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📚 Roadmap Reading</h1>

    <a href="https://htmlpreview.github.io/?https://github.com/khiemvutrong/books/blob/main/domain-driven-design.html" class="roadmap-item">
        <img src="https://github.com/user-attachments/assets/87749d80-c847-469f-9a51-b3504431fb10" alt="DDD Eric Evans" class="book-img">
        <div class="content">
            <h2>1. Domain Driven Design</h2>
            <p>Tác giả: Eric Evans</p>
            <span class="btn-read">Đọc ngay →</span>
        </div>
    </a>

    <hr class="divider">

    <a href="https://htmlpreview.github.io/?https://github.com/khiemvutrong/books/blob/main/learing-domain-driven-design.html" class="roadmap-item">
        <img src="https://github.com/user-attachments/assets/1feef393-ff3f-46e1-b66d-c842ffa6f920" alt="Learning DDD" class="book-img">
        <div class="content">
            <h2>2. Learning Domain Driven Design</h2>
            <p>Tác giả: Vlad Khononov</p>
            <span class="btn-read">Đọc ngay →</span>
        </div>
    </a>
</div>

</body>
</html>
